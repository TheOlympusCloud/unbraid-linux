[package]
name = "unbraid"
version = "2.8.2"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
description = "Unbraid by TheOlympus: every app its own VPN exit, on Linux"
publish = false

[dependencies]
# winit access (to raise the window, and to check a saved place against the screens) is unstable API: hence ~1.18.
slint = { version = "~1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit-x11", "backend-winit-wayland", "renderer-software", "accessibility", "unstable-winit-030"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "fs", "io-util", "process", "signal"] }
tokio-stream = "0.1"
tonic = { version = "0.14.9", default-features = false, features = ["codegen", "transport"] }
tonic-prost = "0.14.9"
prost = "0.14.5"
prost-types = "0.14.5"
hyper-util = { version = "0.1.21", features = ["tokio"] }
tower = { version = "0.5.3", features = ["util"] }
serde = { version = "1", features = ["derive"] }
indexmap = { version = "2", features = ["serde"] }
serde_json = "1.0.154"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
rustls-native-certs = "0.8"
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["ring", "std"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
aes-gcm = "0.11.1"
base64 = "0.22"
sha2 = "0.10"
sha1 = "0.10"
rand = "0.9"
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
unicode-segmentation = "1"
url = "2"
zbus = { version = "6.2.1", default-features = false, features = ["tokio"] }
ksni = "0.3.7"
# SVG icons (apps, the tray) drawn at run time; the same resvg Slint builds, without its raster-image extras.
resvg = { version = "0.48.1", default-features = false }
rqrr = "0.11.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
thiserror = "2"
libc = "0.2"
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }

[build-dependencies]
tonic-prost-build = "0.14.9"
protox = "0.10.0"
slint-build = "1.18.1"

[dev-dependencies]
tempfile = "3"
rcgen = "0.14"

[profile.release]
strip = true
lto = "thin"
codegen-units = 4
